<title>フェルミ推定クイズ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif; background: #0f1117; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.container { width: 100%; max-width: 620px; }
.header { text-align: center; margin-bottom: 24px; }
.header .title { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
.header .title span { color: #4ade80; }
.header .subtitle { font-size: 13px; color: #555; margin-top: 6px; }
.q-count-selector { text-align: center; margin-bottom: 20px; }
.q-count-selector label { font-size: 13px; color: #666; margin-right: 8px; }
.q-count-selector select { background: #1a2035; border: 1px solid #2a3550; color: #ccc; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; outline: none; }
.progress-bar { width: 100%; height: 4px; background: #1e2130; border-radius: 2px; margin-bottom: 18px; overflow: hidden; }
.progress-fill { height: 100%; background: #4ade80; border-radius: 2px; transition: width 0.4s ease; }
.stats { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 13px; }
.stats .correct { color: #4ade80; font-weight: 600; }
.stats .counter { color: #666; }
.question-card { background: #161b27; border: 1px solid #1e2535; border-radius: 18px; padding: 26px 28px; margin-bottom: 14px; }
.category-badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 20px; margin-bottom: 14px; background: #1e2535; color: #6b8ec9; }
.question-text { font-size: 20px; font-weight: 700; line-height: 1.45; color: #fff; }
.question-hint { font-size: 11px; color: #444; margin-top: 8px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice-btn { background: #0f1117; border: 1px solid #1e2535; border-radius: 12px; padding: 15px 12px; text-align: center; cursor: pointer; transition: all 0.15s; font-size: 15px; font-weight: 600; color: #ccc; font-family: inherit; line-height: 1.3; }
.choice-btn:hover:not(:disabled) { background: #1a2035; border-color: #3b4a6b; color: #fff; transform: translateY(-1px); }
.choice-btn.correct { background: #0d2b1a; border-color: #4ade80; color: #4ade80; }
.choice-btn.wrong { background: #2b0d0d; border-color: #f87171; color: #f87171; }
.choice-btn.reveal { background: #0d2b1a; border-color: #4ade80; color: #4ade80; opacity: 0.55; }
.choice-btn:disabled { cursor: default; }
.feedback { text-align: center; padding: 16px 20px; border-radius: 12px; margin-top: 12px; font-size: 14px; line-height: 1.6; display: none; }
.feedback.show { display: block; }
.feedback.correct-fb { background: #0d2b1a; border: 1px solid #166534; color: #86efac; }
.feedback.wrong-fb { background: #2b0d0d; border: 1px solid #991b1b; color: #fca5a5; }
.feedback .answer-big { font-size: 21px; font-weight: 800; color: #fff; margin-bottom: 4px; }
.feedback .memo { font-size: 11px; color: #4a5268; margin-top: 6px; }
.next-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #4ade80; color: #0a1a0a; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s; margin-top: 12px; font-family: inherit; display: none; }
.next-btn:hover { background: #22c55e; transform: translateY(-1px); }
.next-btn.show { display: block; }
.result-card { background: #161b27; border: 1px solid #1e2535; border-radius: 20px; padding: 40px 32px; text-align: center; display: none; }
.result-card.show { display: block; }
.result-emoji { font-size: 48px; margin-bottom: 12px; }
.result-score { font-size: 60px; font-weight: 800; color: #4ade80; letter-spacing: -0.03em; }
.result-total { font-size: 18px; color: #555; margin-bottom: 8px; }
.result-msg { font-size: 15px; color: #777; margin-bottom: 28px; line-height: 1.7; white-space: pre-line; }
.result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.restart-btn { padding: 13px 28px; border-radius: 12px; border: none; background: #4ade80; color: #0a1a0a; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.restart-btn:hover { background: #22c55e; }
.all-btn { padding: 13px 28px; border-radius: 12px; border: 1px solid #2a3550; background: transparent; color: #6b8ec9; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.all-btn:hover { background: #1a2035; }
.review-btn { padding: 13px 28px; border-radius: 12px; border: 1px solid #7c3535; background: transparent; color: #f87171; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.review-btn:hover { background: #2b0d0d; }
.review-btn:disabled { opacity: 0.3; cursor: default; }
.mode-badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-left: 8px; background: #2b0d0d; color: #f87171; vertical-align: middle; }
@media(max-width:480px) { .choices { grid-template-columns: 1fr; } .question-text { font-size: 17px; } }
</style>
</head>

<div class="container">
  <div class="header">

    <div class="subtitle" id="total-count-label"></div>
  </div>
  <div class="q-count-selector" id="q-selector">

  <div class="stats">
    <span class="counter" id="counter">1 / 10</span>
    <span class="correct" id="score">正解: 0</span>
  </div>

    <div class="question-hint" id="hint"></div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback">
    <div class="answer-big" id="feedback-answer"></div>
    <div id="feedback-detail"></div>
    <div class="memo" id="feedback-memo"></div>
  </div>
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題 →</button>
  <div class="result-card" id="result-card">
    <div class="result-emoji" id="result-emoji">🎯</div>
    <div class="result-score" id="result-score">0</div>
    <div class="result-total" id="result-total">/ 10問正解</div>

</div>

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function fmt(v,u){
  if(u==="都道府県")return v;
  if(u==="%")return v+"%";
  if(u==="台/世帯")return v+"台/世帯";
  if(typeof v==="number"){
    if(v>=100000)return Math.round(v/10000)+"万"+u;
    if(v>=10000)return (v/10000).toFixed(1)+"万"+u;
    return v.toLocaleString()+u;
  }
  return v+u;
}

function parseD(t,u){
  if(u==="都道府県")return t;
  if(u==="%")return parseFloat(t);
  if(u==="台/世帯")return parseFloat(t);
  const m=t.match(/([\d.]+)万/);
  if(m)return Math.round(parseFloat(m[1])*10000);
  return parseInt(t.replace(/[^\d]/g,""))||t;
}

let questions=[],current=0,score=0,answered=false,TOTAL=10;
let wrongList=[]; // 間違えた問題を蓄積
let isReviewMode=false;

document.getElementById("total-count-label").textContent="全"+QS.length+"問収録";

document.getElementById("q-count").addEventListener("change",function(){
  TOTAL=this.value==="all"?QS.length:parseInt(this.value);
});

function setReviewBadge(on){
  document.getElementById("review-badge").style.display=on?"":"none";
}

function restart(forceAll){
  isReviewMode=false;
  setReviewBadge(false);
  if(forceAll){TOTAL=QS.length;document.getElementById("q-count").value="all";}
  else{const v=document.getElementById("q-count").value;TOTAL=v==="all"?QS.length:parseInt(v);}
  questions=shuffle([...QS]).slice(0,TOTAL);
  wrongList=[];
  current=0;score=0;answered=false;
  document.getElementById("result-card").classList.remove("show");
  document.getElementById("question-card").style.display="";
  document.getElementById("choices").style.display="";
  document.getElementById("q-selector").style.display="";
  renderQ();
}

function startReview(){
  if(wrongList.length===0)return;
  isReviewMode=true;
  setReviewBadge(true);
  questions=shuffle([...wrongList]);
  TOTAL=questions.length;
  wrongList=[];
  current=0;score=0;answered=false;
  document.getElementById("result-card").classList.remove("show");
  document.getElementById("question-card").style.display="";
  document.getElementById("choices").style.display="";
  document.getElementById("q-selector").style.display="none";
  renderQ();
}

function renderQ(){
  answered=false;
  const q=questions[current];
  document.getElementById("progress").style.width=(current/TOTAL*100)+"%";
  document.getElementById("counter").textContent=(current+1)+" / "+TOTAL;
  document.getElementById("score").textContent="正解: "+score;
  document.getElementById("category").textContent=q[0];
  document.getElementById("question").textContent=q[1]+"は？";
  document.getElementById("hint").textContent=q[5]||"";
  document.getElementById("feedback").className="feedback";
  document.getElementById("next-btn").className="next-btn";
  const el=document.getElementById("choices");
  el.innerHTML="";
  shuffle([...q[3]]).forEach(c=>{
    const b=document.createElement("button");
    b.className="choice-btn";
    b.textContent=fmt(c,q[2]);
    b.onclick=()=>pick(c,q);
    el.appendChild(b);
  });
}

function pick(sel,q){
  if(answered)return;
  answered=true;
  const ok=String(sel)===String(q[4]);
  if(ok) score++;
  else wrongList.push(q); // 間違えたら蓄積
  document.querySelectorAll(".choice-btn").forEach(b=>{
    b.disabled=true;
    const bv=parseD(b.textContent,q[2]);
    if(String(bv)===String(q[4]))b.classList.add(ok?"correct":"reveal");
    else if(String(bv)===String(sel)&&!ok)b.classList.add("wrong");
  });
  const fb=document.getElementById("feedback");
  document.getElementById("feedback-answer").textContent=ok?"正解！":"不正解…";
  document.getElementById("feedback-detail").textContent=(ok?"正解は ":"正解は ")+fmt(q[4],q[2])+(ok?" です。":" でした。");
  document.getElementById("feedback-memo").textContent=q[5]||"";
  fb.className="feedback show "+(ok?"correct-fb":"wrong-fb");
  document.getElementById("score").textContent="正解: "+score;
  document.getElementById("next-btn").className="next-btn show";
}

function nextQuestion(){
  current++;
  if(current>=TOTAL)showResult();
  else renderQ();
}

function showResult(){
  document.getElementById("question-card").style.display="none";
  document.getElementById("choices").style.display="none";
  document.getElementById("feedback").className="feedback";
  document.getElementById("next-btn").className="next-btn";
  document.getElementById("q-selector").style.display="none";
  document.getElementById("progress").style.width="100%";
  const p=score/TOTAL;
  const cfg=[[0,0.4,"😅","もう少し練習しましょう！\n数字の感覚はくり返しで身につきます。"],[0.4,0.6,"🤔","なかなかです！惜しい問題をもう一度。"],[0.6,0.8,"👍","よくできました！感覚が身についてきています。"],[0.8,0.95,"🎉","すごい！数字の感覚がかなり鋭いですね！"],[0.95,1.01,"🏆","完璧に近い！フェルミ推定マスターです！"]];
  let emoji="🎯",msg="";
  for(const[lo,hi,e,m]of cfg){if(p>=lo&&p<hi){emoji=e;msg=m;break;}}
  document.getElementById("result-emoji").textContent=emoji;
  document.getElementById("result-score").textContent=score;
  document.getElementById("result-total").textContent="/ "+TOTAL+"問正解";
  // 間違え数を表示
  const wrongCount=TOTAL-score;
  const wrongNote=wrongCount>0?" (間違い "+wrongCount+"問)":"";
  document.getElementById("result-msg").textContent=msg+wrongNote;
  document.getElementById("result-card").classList.add("show");
  // 復習ボタンの状態更新
  const rb=document.getElementById("review-btn");
  rb.disabled=wrongList.length===0;
  rb.textContent=wrongList.length>0?"間違えた"+wrongList.length+"問を復習":"間違いなし！";
}

restart(false);
</script>
</body>
</html>
